name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # 只测 22 / 24：jsdom 30 拉进来的 undici 8 要求 Node >= 22.19，
      # 20 上连 require 都过不去。宿主 Electron 43 内置的是 Node 24，
      # 所以真正要贴的是 24，22 用来兜住下限。
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: 单测
        run: npm test

      - name: mod.json 校验
        run: node scripts/check-manifest.mjs

  package:
    name: 打包能不能出来
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/pack.py
      - uses: actions/upload-artifact@v4
        with:
          name: bili-fav-wall
          path: dist/*.zip
          if-no-files-found: error
