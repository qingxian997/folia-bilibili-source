name: 功能建议
description: 想让它多做什么，或者现在的做法不顺手
title: '[feat] '
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        先说场景，别急着给方案 —— 有些需求宿主的接口根本做不到，把场景说清楚我能直接告诉你卡在哪。

  - type: textarea
    id: scene
    attributes:
      label: 你的场景
      description: 你在用 Folia 做什么的时候，觉得少了点什么？
      placeholder: |
        我有很多 UP 主的合集，每次都要手动贴链接。希望能一次性把常看的几个 UP 的合集都加进来。
    validations:
      required: true

  - type: textarea
    id: expect
    attributes:
      label: 你希望它怎么表现
      description: 描述结果就行，不用写实现。
    validations:
      required: true

  - type: textarea
    id: alternative
    attributes:
      label: 现在你怎么绕过去的
      description: 有临时办法也写一下，能看出这个需求有多痛。
    validations:
      required: false

  - type: dropdown
    id: pr
    attributes:
      label: 愿意提 PR 吗
      options:
        - 可以，我自己来改
        - 可以，但需要指个方向
        - 不了，只提需求
    validations:
      required: true
